; PROJECT_PLAN.md section 3: SENSOR_MODE build flag selects the
; ThermalSensor implementation (SIM / MLX90640 / AMG8833). `esp32dev` is the
; default, hardware-free SIM build used for compile checks before any
; hardware is purchased.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Shared by every environment: drives the airflow-direction servo
; (config.h kServoPin) from the strongest detected hotspot's column, and
; renders the live thermal heatmap on the ILI9341 TFT (HeatmapDisplay).
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit GFX Library@^1.11.9

[env:esp32dev]
build_flags = -D SENSOR_MODE_SIM
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8

[env:esp32dev_mlx90640]
build_flags = -D SENSOR_MODE_MLX90640
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit MLX90640@^1.1.1

[env:esp32dev_amg8833]
build_flags = -D SENSOR_MODE_AMG8833
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit AMG88xx Library@^1.2.1
